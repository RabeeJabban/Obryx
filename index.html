<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbyx</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orbyx">
  <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1420" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Orbyx – organize your chaos">

<style>
/* ===================================================================
   ORBYX · FARBEN
   Die Palette kommt aus dem Logo: Bernstein, Grün, Blau auf Tinte.
   Dieselben Farben bekommen die Kreise in der App.
   =================================================================== */
:root {
  color-scheme: light dark;

  --grund:    #F7F8FA;
  --flaeche:  #FFFFFF;
  --flaeche2: #EEF1F5;
  --linie:    #DFE4EB;
  --linie2:   #C6CEDA;
  --text:     #16233A;
  --text2:    #5C6880;
  --text3:    #8C96A8;

  --blau:      #1B65C9;
  --blauHell:  #E4EDFB;
  --gruen:     #219447;
  --gruenHell: #E2F3E8;
  --gelb:      #B8820F;
  --gelbHell:  #FBF0D8;
  --rot:       #C0392B;
  --rotHell:   #FBE7E4;

  --akzent:     var(--blau);
  --akzentHell: var(--blauHell);

  /* Kreisfarben, aus dem Logo abgeleitet */
  --k0:#1B65C9; --k1:#219447; --k2:#D9A21B; --k3:#C0392B; --k4:#7A4FC4;
  --k5:#0F8E96; --k6:#D2691E; --k7:#C2417F; --k8:#4A6572; --k9:#5C8A1E;

  --schatten:  0 1px 2px rgba(22,35,58,.06);
  --schatten2: 0 10px 34px rgba(22,35,58,.18);
  --rund: 14px; --rund2: 20px;
  --unten: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --grund:    #0E1420;
    --flaeche:  #172033;
    --flaeche2: #1F2B42;
    --linie:    #26334A;
    --linie2:   #3A4A66;
    --text:     #E8EDF5;
    --text2:    #9AA7BF;
    --text3:    #6B7890;

    --blau:      #5B9BF0;
    --blauHell:  #14263F;
    --gruen:     #4CC271;
    --gruenHell: #102D1C;
    --gelb:      #E8B944;
    --gelbHell:  #2E2410;
    --rot:       #F0776A;
    --rotHell:   #331A17;

    --k0:#5B9BF0; --k1:#4CC271; --k2:#E8B944; --k3:#F0776A; --k4:#A98BF0;
    --k5:#3FC4CE; --k6:#F0964A; --k7:#EC7AB4; --k8:#8FA3B8; --k9:#9BC94A;

    --schatten:  0 1px 2px rgba(0,0,0,.5);
    --schatten2: 0 10px 34px rgba(0,0,0,.65);
  }
}

/* ===================================================================
   GRUNDLAGEN
   Alles benutzt logische Richtungen (inline-start statt left),
   damit Arabisch von rechts nach links ohne Sonderregeln läuft.
   =================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45;
  background: var(--grund); color: var(--text);
  overscroll-behavior-y: none;
}
[dir="rtl"] body { font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif; }

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.versteckt { display: none !important; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

/* Zahlen und Zeiten immer von links nach rechts, auch im Arabischen */
.ltr { direction: ltr; unicode-bidi: isolate; }

/* ---------- Anmeldung ---------- */
.mitte {
  min-height: 100dvh; display: flex;
  align-items: center; justify-content: center; padding: 16px;
}
.karte {
  background: var(--flaeche); border: 1px solid var(--linie);
  border-radius: var(--rund2); box-shadow: var(--schatten);
  padding: 42px 28px; width: 100%; max-width: 390px; text-align: center;
}
.karte h1 {
  margin: 20px 0 2px; font-size: 32px; font-weight: 700; letter-spacing: -.8px;
}
.karte p { margin: 6px 0 26px; color: var(--text2); font-size: 14px; }
.sprachwahl { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
.sprachwahl button {
  padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--linie); background: none; color: var(--text2);
}
.sprachwahl button.an { background: var(--akzent); border-color: var(--akzent); color: #fff; }

.knopf {
  width: 100%; padding: 13px 18px; border: 0; border-radius: 12px;
  background: var(--akzent); color: #fff; font-size: 15px; font-weight: 600;
}
.knopf.hell   { background: var(--flaeche2); color: var(--text); }
.knopf.rand   { background: none; color: var(--text2); border: 1px solid var(--linie2); }
.knopf:active { transform: translateY(1px); }
.knopf:disabled { opacity: .45; }

/* ---------- Kopfzeile ---------- */
header {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--grund) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--linie);
  padding: 10px 14px; display: flex; align-items: center; gap: 8px;
}
header .marke { display: flex; align-items: center; gap: 9px; flex-grow: 1; min-width: 0; }
header .marke b { font-size: 19px; letter-spacing: -.4px; }

.rundknopf {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; padding: 0;
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--text2);
  display: flex; align-items: center; justify-content: center;
}
.rundknopf img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }
/* Ohne Profilbild steht im Knopf der erste Buchstabe des Namens */
.rundknopf[data-kuerzel]:not([data-kuerzel=""])::after {
  content: attr(data-kuerzel); font-size: 15px; font-weight: 700; color: var(--text2);
}
.zaehler {
  position: absolute; top: -5px; inset-inline-end: -5px;
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px;
  background: var(--rot); color: #fff; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--grund);
}

/* ---------- Ansichten und Filter ---------- */
nav.ansichten {
  display: flex; gap: 4px; padding: 10px 14px 0;
  overflow-x: auto; scrollbar-width: none;
  max-width: 980px; margin: 0 auto;
}
nav.ansichten::-webkit-scrollbar { display: none; }
nav.ansichten button {
  flex: 1 0 auto; padding: 8px 11px; border: 0; border-radius: 99px;
  background: none; color: var(--text2);
  font-size: 14px; font-weight: 600; white-space: nowrap;
}
@media (min-width: 420px) { nav.ansichten button { padding: 8px 16px; } }
nav.ansichten button.an { background: var(--flaeche2); color: var(--text); }

.filter {
  display: flex; gap: 6px; padding: 8px 14px 0;
  max-width: 980px; margin: 0 auto;
}
.filter button {
  flex: 1; padding: 7px 10px; border: 1px solid var(--linie); border-radius: 10px;
  background: var(--flaeche); color: var(--text2); font-size: 13px; font-weight: 600;
}
.filter button.an { background: var(--akzentHell); border-color: var(--akzent); color: var(--akzent); }

/* ---------- Zeitleiste ---------- */
.zeitleiste {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px 8px; max-width: 980px; margin: 0 auto;
}
.zeitleiste .mitteBlock { flex-grow: 1; min-width: 0; }
.zeitleiste b { display: block; font-size: 19px; letter-spacing: -.3px; }
.zeitleiste .unter {
  font-size: 13px; color: var(--text2);
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.pfeil {
  width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; padding: 0;
  border: 1px solid var(--linie); background: var(--flaeche); color: var(--text2);
  font-size: 18px; line-height: 1;
}
.tagMarke {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 700; background: var(--flaeche2); color: var(--text2);
}
.tagMarke.frei { background: var(--gruenHell); color: var(--gruen); }

/* ---------- Suche ---------- */
.suchleiste { padding: 10px 14px 0; display: flex; gap: 8px; max-width: 980px; margin: 0 auto; }
.suchleiste input {
  flex-grow: 1; padding: 11px 14px;
  border: 1px solid var(--linie); border-radius: 12px; background: var(--flaeche);
}

/* ---------- Liste ---------- */
main {
  padding: 8px 14px calc(120px + var(--unten));
  display: flex; flex-direction: column; gap: 8px;
  max-width: 980px; margin: 0 auto;
}
.leer { color: var(--text2); font-size: 14px; text-align: center; padding: 48px 20px; }
.leer .gross { font-size: 34px; margin-bottom: 10px; opacity: .45; }

.trenner {
  font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: var(--text3); margin: 16px 0 2px;
  display: flex; align-items: center; gap: 8px;
}
.trenner.warn { color: var(--rot); }
.trenner::after { content: ""; flex-grow: 1; height: 1px; background: var(--linie); }

.eintrag {
  background: var(--flaeche); border: 1px solid var(--linie);
  border-inline-start: 3px solid var(--linie2);
  border-radius: var(--rund); box-shadow: var(--schatten);
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;
}
.eintrag.faellig { border-inline-start-color: var(--rot); }
.eintrag .zeit {
  font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text2);
  min-width: 44px; padding-top: 1px; display: flex; flex-direction: column;
  direction: ltr;
}
.eintrag .zeit small { font-size: 11px; color: var(--text3); }
.eintrag .inhalt { flex-grow: 1; min-width: 0; }
.eintrag .titel {
  font-weight: 600; font-size: 15px;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.eintrag .unterzeile {
  font-size: 13px; color: var(--text2); margin-top: 2px; overflow-wrap: anywhere;
}
.eintrag.erledigt .titel { text-decoration: line-through; color: var(--text3); }

.serieRing { font-size: 13px; color: var(--text3); font-weight: 400; }
.kreisPunkt { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

.marke {
  display: inline-block; margin-top: 7px; padding: 3px 9px; border-radius: 99px;
  font-size: 12px; font-weight: 600; background: var(--flaeche2); color: var(--text2);
}
.marke.bald { background: var(--gelbHell); color: var(--gelb); }
.marke.jetzt, .marke.spaet { background: var(--rotHell); color: var(--rot); }
.marke.gut { background: var(--gruenHell); color: var(--gruen); }

.haken {
  width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; padding: 0;
  border: 2px solid var(--linie2); background: var(--flaeche);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
}
.haken.an { background: var(--gruen); border-color: var(--gruen); }
.weg { background: none; border: 0; color: var(--text3); font-size: 19px; padding: 0 3px; line-height: 1; }

/* Zusage-Knöpfe am Eintrag */
.zusage { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.zusage button {
  padding: 6px 13px; border-radius: 9px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--linie2); background: none; color: var(--text2);
}
.zusage button.ja.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.zusage button.nein.an { background: var(--rot); border-color: var(--rot); color: #fff; }

/* ---------- Woche ---------- */
.woche { display: flex; flex-direction: column; gap: 10px; }
.wochentag { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); overflow: hidden; }
.wochentag > .kopf {
  display: flex; align-items: baseline; gap: 8px; padding: 9px 13px;
  background: var(--flaeche2); font-size: 13px; font-weight: 700;
}
.wochentag > .kopf .num { color: var(--text2); font-weight: 500; }
.wochentag > .kopf .heute { margin-inline-start: auto; font-size: 11px; font-weight: 700; color: var(--akzent); }
.wochentag .zeilen { padding: 4px 0; }
.wochentag .mini { display: flex; gap: 10px; align-items: baseline; padding: 6px 13px; font-size: 14px; }
.wochentag .mini .z { font-variant-numeric: tabular-nums; color: var(--text2); font-size: 12px; min-width: 40px; direction: ltr; }
.wochentag .mini.erledigt { color: var(--text3); text-decoration: line-through; }
.wochentag .nix { padding: 8px 13px; color: var(--text3); font-size: 13px; }

/* ---------- Monat ---------- */
.monat { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); padding: 10px; }
.monatKopf, .monatGitter { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.monatKopf div { text-align: center; font-size: 11px; font-weight: 700; color: var(--text3); padding-bottom: 6px; }
.monatZelle {
  aspect-ratio: 1/1; border: 0; border-radius: 10px; background: none; padding: 4px 2px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 13px; color: var(--text);
}
.monatZelle.fremd { color: var(--text3); opacity: .5; }
.monatZelle.heute { background: var(--akzentHell); color: var(--akzent); font-weight: 700; }
.monatZelle.gewaehlt { outline: 2px solid var(--akzent); }
.monatZelle.feier { background: var(--flaeche2); }
.monatZelle .punkte { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
.monatZelle .punkt { width: 5px; height: 5px; border-radius: 50%; background: var(--akzent); }
.monatZelle .punkt.task { background: var(--gruen); }

/* ---------- Personen und Lücken ---------- */
.personen { display: flex; flex-wrap: wrap; gap: 7px; }
.person {
  padding: 8px 13px; border-radius: 99px; border: 1px solid var(--linie2);
  background: var(--flaeche); color: var(--text2); font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 7px;
}
.person.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }

.luecke {
  display: flex; align-items: center; gap: 12px;
  background: var(--gruenHell); border-radius: var(--rund); padding: 12px 14px;
}
.luecke b { font-variant-numeric: tabular-nums; color: var(--gruen); direction: ltr; }
.luecke .dauer { font-size: 13px; color: var(--text2); flex-grow: 1; }

/* ---------- Kreise ---------- */
.kreisKarte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--rund); padding: 14px; }
.kreisKarte .kopf { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.kreisKarte .kopf b { font-size: 16px; flex-grow: 1; }
.mitglied {
  display: flex; align-items: center; gap: 9px; padding: 7px 0;
  font-size: 14px; border-top: 1px solid var(--linie);
}
.mitglied .mail { color: var(--text3); font-size: 12px; overflow-wrap: anywhere; }
.mitglied .rolle {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .5px;
}
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--flaeche2);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text2); overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.einladung {
  display: flex; align-items: center; gap: 9px; padding: 7px 0;
  font-size: 14px; border-top: 1px dashed var(--linie2); color: var(--text2);
}
.einladung .warte { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--gelb); }
.klein {
  padding: 5px 10px; font-size: 12px; border-radius: 8px;
  border: 1px solid var(--linie2); background: none; color: var(--text2);
}
.klein.gefahr { color: var(--rot); border-color: var(--rot); }
.farbwahl { display: flex; gap: 7px; flex-wrap: wrap; }
.farbe { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.farbe.an { border-color: var(--text); }

/* ---------- Dashboard ---------- */
.kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px,1fr)); gap: 8px; }
.kachel { background: var(--flaeche2); border-radius: 12px; padding: 12px 10px; text-align: center; }
.kachel b { display: block; font-size: 22px; letter-spacing: -.5px; direction: ltr; }
.kachel span { font-size: 12px; color: var(--text2); }
.kachel.warn b { color: var(--rot); }

/* ---------- Nachrichten ---------- */
.post {
  background: var(--flaeche); border: 1px solid var(--linie);
  border-inline-start: 3px solid var(--linie2); border-radius: var(--rund); padding: 12px 14px;
}
.post.neu { border-inline-start-color: var(--akzent); background: var(--akzentHell); }
.post .von { font-size: 13px; font-weight: 700; }
.post .wann { font-size: 12px; color: var(--text3); }
.post .text { margin-top: 5px; font-size: 14px; overflow-wrap: anywhere; }
.post .knoepfe { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.post .knoepfe button {
  padding: 6px 12px; font-size: 13px; border-radius: 9px;
  border: 1px solid var(--linie2); background: none; color: var(--text2);
}

/* ---------- Formular ---------- */
.plus {
  position: fixed; z-index: 45; inset-inline-end: 16px; bottom: calc(16px + var(--unten));
  width: 58px; height: 58px; border-radius: 50%; border: 0;
  background: var(--akzent); color: #fff; font-size: 30px; line-height: 1;
  box-shadow: var(--schatten2);
}
dialog {
  border: 0; padding: 0; background: var(--flaeche); color: var(--text);
  width: 100%; max-width: 520px; max-height: 92dvh;
  border-radius: var(--rund2) var(--rund2) 0 0; margin: auto auto 0;
  box-shadow: var(--schatten2);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
@media (min-width: 560px) { dialog { border-radius: var(--rund2); margin: auto; } }
.dlgInhalt { padding: 20px 18px calc(20px + var(--unten)); overflow-y: auto; max-height: 92dvh; }
dialog h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.3px; }
dialog .dlgUnter { margin: 0 0 18px; font-size: 13px; color: var(--text2); }

label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin: 14px 0 6px; }
input[type=text], input[type=date], input[type=time],
input[type=email], input[type=search], textarea {
  width: 100%; padding: 11px 13px; border: 1px solid var(--linie);
  border-radius: 12px; background: var(--grund); color: var(--text);
}
textarea { resize: vertical; min-height: 62px; }
.reihe { display: flex; gap: 10px; }
.reihe > div { flex: 1; min-width: 0; }

.wahl { display: flex; gap: 7px; }
.wahl button {
  flex: 1; padding: 11px 8px; border: 1px solid var(--linie); border-radius: 12px;
  background: var(--grund); color: var(--text2); font-size: 14px; font-weight: 600;
}
.wahl button.an { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.wahl.klein { margin-top: 12px; }

.tageWahl { display: flex; gap: 5px; }
.tagKnopf {
  flex: 1; padding: 10px 0; border: 1px solid var(--linie); border-radius: 10px;
  background: var(--grund); color: var(--text2); font-size: 13px; font-weight: 600;
}
.tagKnopf.an { background: var(--gruen); border-color: var(--gruen); color: #fff; }

.schalter {
  display: flex; align-items: center; gap: 11px; margin: 12px 0 0;
  font-size: 14px; font-weight: 400; color: var(--text); cursor: pointer;
}
.schalter input { width: 21px; height: 21px; flex-shrink: 0; margin: 0; accent-color: var(--gruen); }

.hinweis { font-size: 12px; color: var(--text3); margin-top: 8px; line-height: 1.5; }
.fehler { color: var(--rot); font-size: 13px; margin-top: 12px; }
.gutText { color: var(--gruen); font-size: 14px; font-weight: 600; margin-top: 12px; }
.aktionen { display: flex; gap: 9px; margin-top: 22px; }
.aktionen .knopf { flex: 1; }
.block { border-top: 1px solid var(--linie); margin-top: 18px; padding-top: 6px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: start; font-size: 11px; font-weight: 700; letter-spacing: .5px;
     text-transform: uppercase; color: var(--text3); padding: 0 8px 8px 0; }
td { padding: 8px 8px 8px 0; border-top: 1px solid var(--linie); vertical-align: top; }
td.n { color: var(--text2); white-space: nowrap; }
</style>
</head>
<body>

<!-- =============== ANMELDUNG =============== -->
<div id="loginView" class="mitte">
  <div class="karte">
    <svg width="92" height="92" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke-linecap="round">
        <circle cx="60" cy="60" r="50" stroke="var(--k2)" stroke-width="7"
                stroke-dasharray="248 66" transform="rotate(-40 60 60)"/>
        <circle cx="60" cy="60" r="39" stroke="var(--k1)" stroke-width="8"
                stroke-dasharray="180 65" transform="rotate(130 60 60)"/>
        <circle cx="60" cy="60" r="29" stroke="var(--k1)" stroke-width="7"
                stroke-dasharray="120 62" transform="rotate(-10 60 60)"/>
        <circle cx="60" cy="60" r="17" stroke="var(--k0)" stroke-width="10"/>
      </g>
    </svg>
    <h1>Orbyx</h1>
    <p data-i18n="spruch"></p>
    <button class="knopf" id="loginBtn" data-i18n="anmelden"></button>
    <div id="loginFehler" class="fehler"></div>
    <div class="sprachwahl" id="sprachwahl"></div>
  </div>
</div>

<!-- =============== APP =============== -->
<div id="appView" class="versteckt">

  <header>
    <div class="marke">
      <svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true">
        <g fill="none" stroke-linecap="round">
          <circle cx="60" cy="60" r="50" stroke="var(--k2)" stroke-width="9"
                  stroke-dasharray="248 66" transform="rotate(-40 60 60)"/>
          <circle cx="60" cy="60" r="36" stroke="var(--k1)" stroke-width="10"
                  stroke-dasharray="165 60" transform="rotate(130 60 60)"/>
          <circle cx="60" cy="60" r="17" stroke="var(--k0)" stroke-width="12"/>
        </g>
      </svg>
      <b>Orbyx</b>
    </div>

    <button class="rundknopf" id="sucheBtn" data-i18n-al="suchen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
      </svg>
    </button>

    <button class="rundknopf" id="findenBtn" data-i18n-al="terminFinden">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <circle cx="9" cy="8" r="3.2"></circle>
        <path d="M3 19c0-3.2 2.7-5 6-5s6 1.8 6 5"></path>
        <path d="M17 6v6M20 9h-6"></path>
      </svg>
    </button>

    <button class="rundknopf" id="kreiseBtn" data-i18n-al="kreise">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="12" r="6"></circle><circle cx="15" cy="12" r="6"></circle>
      </svg>
    </button>

    <button class="rundknopf" id="postBtn" data-i18n-al="nachrichten" style="position:relative">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path>
        <path d="M10.5 20a2 2 0 0 0 3 0"></path>
      </svg>
      <span class="zaehler versteckt" id="postZahl">0</span>
    </button>

    <button class="rundknopf" id="michBtn" data-i18n-al="konto"><img id="photo" alt=""></button>
  </header>

  <nav class="ansichten" id="nav">
    <button data-v="tag" class="an" data-i18n="vTag"></button>
    <button data-v="woche" data-i18n="vWoche"></button>
    <button data-v="monat" data-i18n="vMonat"></button>
    <button data-v="aufgaben" data-i18n="vAufgaben"></button>
    <button data-v="liste" data-i18n="vListe"></button>
  </nav>

  <div class="filter" id="filter">
    <button data-f="alles" class="an" data-i18n="fAlles"></button>
    <button data-f="termin" data-i18n="fTermine"></button>
    <button data-f="task" data-i18n="fAufgaben"></button>
  </div>

  <div class="suchleiste versteckt" id="suchleiste">
    <input id="sucheFeld" type="search" data-i18n-ph="suchen" autocomplete="off">
    <button class="rundknopf" id="sucheZu" data-i18n-al="schliessen">&#10005;</button>
  </div>

  <div class="zeitleiste" id="zeitleiste">
    <button class="pfeil" id="zurueck" data-i18n-al="zurueck">&#8249;</button>
    <div class="mitteBlock"><b id="zeitTitel"></b><div class="unter" id="zeitUnter"></div></div>
    <button class="pfeil" id="heuteBtn" data-i18n-al="heute">&#9679;</button>
    <button class="pfeil" id="vor" data-i18n-al="weiter">&#8250;</button>
  </div>

  <main id="buehne"></main>

  <button class="plus" id="neuBtn" data-i18n-al="neuerEintrag">+</button>
</div>

<!-- =============== EINTRAG =============== -->
<dialog id="dlgEintrag">
  <form id="formEintrag" class="dlgInhalt">
    <h2 id="dlgTitel"></h2>
    <p class="dlgUnter" id="dlgUnter"></p>

    <div class="wahl">
      <button type="button" id="typTermin" class="an" data-i18n="fTermin"></button>
      <button type="button" id="typTask" data-i18n="fAufgabe"></button>
    </div>
    <div class="wahl klein">
      <button type="button" id="wdhEinmal" class="an" data-i18n="fEinmal"></button>
      <button type="button" id="wdhSerie" data-i18n="fSerie"></button>
    </div>

    <label for="fTitel" data-i18n="fTitel"></label>
    <input type="text" id="fTitel" required maxlength="120" data-i18n-ph="fTitelBsp">

    <label for="fDatum" id="lblDatum"></label>
    <input type="date" id="fDatum" required>

    <div class="reihe">
      <div><label for="fStart" id="lblStart"></label><input type="time" id="fStart"></div>
      <div id="endeFeld"><label for="fEnde" data-i18n="fBis"></label><input type="time" id="fEnde"></div>
    </div>

    <div id="serieFeld" class="versteckt block">
      <label data-i18n="fWochentage"></label>
      <div class="tageWahl" id="tageWahl"></div>
      <label for="fBis" data-i18n="fBisEinschl"></label>
      <input type="date" id="fBis">
      <label class="schalter" for="fFeiertage">
        <input type="checkbox" id="fFeiertage" checked><span data-i18n="fOhneFeiertage"></span>
      </label>
      <label class="schalter" for="fFerien">
        <input type="checkbox" id="fFerien"><span data-i18n="fOhneFerien"></span>
      </label>
      <p class="hinweis" data-i18n="fNrw"></p>
    </div>

    <div id="fristFeld" class="versteckt">
      <label for="fFrist" data-i18n="fFrist"></label>
      <input type="date" id="fFrist">
    </div>

    <label for="fOrt" data-i18n="fOrt"></label>
    <input type="text" id="fOrt" maxlength="120" data-i18n-ph="fOrtBsp">

    <label for="fNotiz" data-i18n="fNotiz"></label>
    <textarea id="fNotiz" maxlength="500" data-i18n-ph="fOptional"></textarea>

    <div class="block" id="teilenBlock">
      <label data-i18n="fTeilen"></label>
      <div class="personen" id="teilenWahl"></div>
      <p class="hinweis" data-i18n="fTeilenHinweis"></p>
    </div>

    <div class="block versteckt" id="zuweisenBlock">
      <label data-i18n="fZuweisen"></label>
      <div class="personen" id="zuweisenWahl"></div>
      <p class="hinweis" data-i18n="fZuweisenHinweis"></p>
    </div>

    <div id="formFehler" class="fehler"></div>
    <button type="button" class="knopf rand versteckt" id="absagenBtn" style="margin-top:16px"></button>

    <div class="aktionen">
      <button type="button" class="knopf hell" id="abbrechen" data-i18n="abbrechen"></button>
      <button type="submit" class="knopf" data-i18n="speichern"></button>
    </div>
  </form>
</dialog>

<!-- =============== KREISE =============== -->
<dialog id="dlgKreise">
  <div class="dlgInhalt">
    <h2 data-i18n="kTitel"></h2>
    <p class="dlgUnter" data-i18n="kUnter"></p>
    <div id="kreisListe" style="display:flex;flex-direction:column;gap:12px"></div>

    <div class="block" id="neuerKreisBlock">
      <label for="kName" data-i18n="kNeuer"></label>
      <input type="text" id="kName" maxlength="40" data-i18n-ph="kNameBsp">
      <label data-i18n="kArt"></label>
      <div class="wahl">
        <button type="button" id="artKreis" class="an" data-i18n="kArtKreis"></button>
        <button type="button" id="artStern" data-i18n="kArtStern"></button>
      </div>
      <p class="hinweis" data-i18n="kArtHinweis"></p>
      <label data-i18n="kFarbe"></label>
      <div class="farbwahl" id="kFarben"></div>
      <div id="kreisFehler" class="fehler"></div>
      <div class="aktionen">
        <button type="button" class="knopf hell" id="kreiseZu" data-i18n="schliessen"></button>
        <button type="button" class="knopf" id="kreisAnlegen" data-i18n="kAnlegen"></button>
      </div>
    </div>
    <div class="aktionen versteckt" id="kreiseNurZu">
      <button type="button" class="knopf hell" id="kreiseZu2" data-i18n="schliessen"></button>
    </div>
  </div>
</dialog>

<!-- =============== EINLADEN =============== -->
<dialog id="dlgEinladen">
  <form id="formEinladen" class="dlgInhalt">
    <h2 data-i18n="eiTitel"></h2>
    <p class="dlgUnter" id="einladenUnter"></p>
    <label for="eMail" data-i18n="eiMail"></label>
    <input type="email" id="eMail" required placeholder="name@mail.com">
    <label class="schalter" for="eVerwalter">
      <input type="checkbox" id="eVerwalter"><span data-i18n="eiAlsVerwalter"></span>
    </label>
    <p class="hinweis" data-i18n="eiHinweis"></p>
    <div id="einladenFehler" class="fehler"></div>
    <div id="einladenGut" class="gutText"></div>
    <div class="aktionen">
      <button type="button" class="knopf hell" id="einladenZu" data-i18n="schliessen"></button>
      <button type="submit" class="knopf" data-i18n="eiSenden"></button>
    </div>
  </form>
</dialog>

<!-- =============== TERMIN FINDEN =============== -->
<dialog id="dlgFinden">
  <div class="dlgInhalt">
    <h2 data-i18n="tfTitel"></h2>
    <p class="dlgUnter" data-i18n="tfUnter"></p>
    <label data-i18n="tfMitWem"></label>
    <div class="personen" id="findenPersonen"></div>
    <div class="reihe" style="margin-top:6px">
      <div><label for="fvVon" data-i18n="tfVon"></label><input type="date" id="fvVon"></div>
      <div><label for="fvBis" data-i18n="tfBis"></label><input type="date" id="fvBis"></div>
    </div>
    <div class="reihe">
      <div><label for="fvFrueh" data-i18n="tfFrueh"></label><input type="time" id="fvFrueh" value="08:00"></div>
      <div><label for="fvSpaet" data-i18n="tfSpaet"></label><input type="time" id="fvSpaet" value="22:00"></div>
    </div>
    <label data-i18n="tfDauer"></label>
    <div class="wahl" id="fvDauerWahl"></div>
    <div id="findenFehler" class="fehler"></div>
    <div id="findenErgebnis" style="margin-top:16px;display:flex;flex-direction:column;gap:8px"></div>
    <div class="aktionen">
      <button type="button" class="knopf hell" id="findenZu" data-i18n="schliessen"></button>
      <button type="button" class="knopf" id="findenStart" data-i18n="tfSuchen"></button>
    </div>
  </div>
</dialog>

<!-- =============== POSTEINGANG =============== -->
<dialog id="dlgPost">
  <div class="dlgInhalt">
    <h2 data-i18n="nTitel"></h2>
    <p class="dlgUnter" data-i18n="nUnter"></p>
    <div id="postListe" style="display:flex;flex-direction:column;gap:9px"></div>
    <div class="aktionen">
      <button type="button" class="knopf hell" id="postZu" data-i18n="schliessen"></button>
      <button type="button" class="knopf rand" id="postGelesen" data-i18n="nAlleGelesen"></button>
    </div>
  </div>
</dialog>

<!-- =============== NACHRICHT SCHREIBEN =============== -->
<dialog id="dlgSchreiben">
  <form id="formSchreiben" class="dlgInhalt">
    <h2 data-i18n="sTitel"></h2>
    <p class="dlgUnter" id="schreibenAn"></p>
    <label for="sText" data-i18n="sText"></label>
    <textarea id="sText" required maxlength="800" data-i18n-ph="sTextBsp"></textarea>
    <div id="schreibenFehler" class="fehler"></div>
    <div id="schreibenGut" class="gutText"></div>
    <div class="aktionen">
      <button type="button" class="knopf hell" id="schreibenZu" data-i18n="abbrechen"></button>
      <button type="submit" class="knopf" data-i18n="sSenden"></button>
    </div>
  </form>
</dialog>

<!-- =============== KONTO =============== -->
<dialog id="dlgMich">
  <div class="dlgInhalt">
    <h2 id="michName"></h2>
    <p class="dlgUnter" id="michMail"></p>

    <div class="block">
      <label data-i18n="koSprache"></label>
      <div class="sprachwahl" id="sprachwahl2" style="justify-content:flex-start"></div>
    </div>

    <div class="block">
      <label data-i18n="koZahlen"></label>
      <div class="kacheln" id="meineZahlen"></div>
    </div>

    <div class="aktionen">
      <button type="button" class="knopf hell" id="michZu" data-i18n="schliessen"></button>
      <button type="button" class="knopf rand" id="betriebBtn" data-i18n="bTitel"></button>
      <button type="button" class="knopf rand" id="logoutBtn" data-i18n="koAbmelden"></button>
    </div>
  </div>
</dialog>

<!-- =============== BETRIEB =============== -->
<dialog id="dlgBetrieb">
  <div class="dlgInhalt">
    <h2 data-i18n="bTitel"></h2>
    <p class="dlgUnter" data-i18n="bUnter"></p>

    <div class="kacheln" id="betriebZahlen"></div>

    <div class="block">
      <label data-i18n="bKonten"></label>
      <div style="overflow-x:auto"><table id="betriebTabelle"></table></div>
    </div>

    <div class="block">
      <label data-i18n="bAlleKreise"></label>
      <div id="betriebKreise" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <p class="hinweis" data-i18n="bHinweis"></p>
    <p class="hinweis" id="betriebFehler"></p>

    <div class="aktionen">
      <button type="button" class="knopf hell" id="betriebZu" data-i18n="schliessen"></button>
    </div>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
