<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitplaner</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6f8;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,.08);
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p.sub { margin: 0 0 24px; color: #666; font-size: 14px; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #1a73e8;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #e8eaed; color: #333; margin-top: 12px; }
    button:hover { opacity: .9; }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: block;
      background: #ddd;
    }
    .mail { color: #666; font-size: 14px; margin: 4px 0 20px; }
    .hidden { display: none; }
    .error { color: #c5221f; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="card">

    <!-- Ansicht 1: noch nicht angemeldet -->
    <div id="loginView">
      <h1>Zeitplaner</h1>
      <p class="sub">Melde dich an, um deine Termine und Aufgaben zu sehen.</p>
      <button id="loginBtn">Mit Google anmelden</button>
      <div id="error" class="error"></div>
    </div>

    <!-- Ansicht 2: angemeldet -->
    <div id="appView" class="hidden">
      <img id="photo" class="avatar" alt="">
      <h1 id="name"></h1>
      <p class="mail" id="email"></p>
      <p class="sub">Dein Profil ist angelegt. Termine kommen im naechsten Schritt.</p>
      <button class="secondary" id="logoutBtn">Abmelden</button>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
