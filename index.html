<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sawa</title>
  <style>
    :root {
      --grund: #FFFCF7;
      --flaeche: #ffffff;
      --linie: #E3DCD1;
      --text: #1C1A17;
      --grau: #6B6259;
      --akzent: #D4533B;
      --gruen: #2E9E8F;
      --rot: #C0392B;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--grund);
      color: var(--text);
      padding-bottom: 96px;
    }
    button { font: inherit; cursor: pointer; }
    .versteckt { display: none !important; }

    /* ---------- Login ---------- */
    .mitte {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 16px;
    }
    .karte {
      background: var(--flaeche); border: 1px solid var(--linie);
      border-radius: 20px; padding: 36px 26px; width: 100%;
      max-width: 380px; text-align: center;
    }
    .karte h1 { margin: 14px 0 4px; font-size: 26px; }
    .karte p  { margin: 0 0 24px; color: var(--grau); font-size: 14px; }

    .knopf {
      width: 100%; padding: 13px 16px; border: 0; border-radius: 12px;
      background: var(--akzent); color: #fff; font-size: 15px; font-weight: 600;
    }
    .knopf.hell { background: #EDE7DC; color: var(--text); }
    .knopf.rand {
      background: none; color: var(--grau);
      border: 1px solid var(--linie); font-weight: 500;
    }
    .knopf:active { opacity: .85; }

    /* ---------- Kopfzeile ---------- */
    header {
      position: sticky; top: 0; z-index: 10; background: var(--grund);
      border-bottom: 1px solid var(--linie); padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    header .name { font-size: 19px; font-weight: 700; flex-grow: 1; }
    header img { width: 34px; height: 34px; border-radius: 50%; }
    .rundknopf {
      width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
      border: 1px solid var(--linie); background: var(--flaeche);
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .textknopf {
      background: none; border: 0; color: var(--grau);
      font-size: 13px; padding: 6px;
    }

    /* ---------- Suchleiste ---------- */
    .suchleiste { padding: 12px 16px 4px; display: flex; gap: 10px; }
    .suchleiste input { flex-grow: 1; }

    /* ---------- Datumsleiste ---------- */
    .datumsleiste {
      display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px;
    }
    .datumsleiste .tag { flex-grow: 1; min-width: 0; }
    .datumsleiste .tag b    { display: block; font-size: 19px; }
    .datumsleiste .tag span { font-size: 13px; color: var(--grau); }
    .pfeil {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      border: 1px solid var(--linie); background: var(--flaeche);
      font-size: 17px; line-height: 1;
    }

    /* ---------- Liste ---------- */
    main { padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; }
    .leer { color: var(--grau); font-size: 14px; text-align: center; padding: 40px 0; }

    .trenner {
      font-size: 12px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; color: var(--grau); margin: 14px 0 2px;
    }
    .trenner.warn { color: var(--rot); }

    .eintrag {
      background: var(--flaeche); border: 1px solid var(--linie);
      border-radius: 14px; padding: 13px 15px;
      display: flex; gap: 13px; align-items: flex-start;
    }
    .eintrag.faellig { border-color: var(--rot); }
    .eintrag .zeit {
      font-variant-numeric: tabular-nums; font-size: 13px;
      color: var(--grau); min-width: 46px; padding-top: 2px;
    }
    .eintrag .inhalt { flex-grow: 1; min-width: 0; }
    .eintrag .titel  { font-weight: 600; font-size: 15px; }
    .eintrag .notiz  { font-size: 13px; color: var(--grau); margin-top: 3px; }
    .eintrag.erledigt .titel { text-decoration: line-through; color: var(--grau); }

    .serieZeichen {
      font-size: 13px; color: var(--grau); margin-left: 7px;
      font-weight: 400;
    }

    .marke {
      display: inline-block; margin-top: 6px; padding: 3px 9px;
      border-radius: 99px; font-size: 12px; font-weight: 600;
      background: #EDE7DC; color: var(--grau);
    }
    .marke.bald  { background: #FBE9D0; color: #8A5207; }
    .marke.jetzt, .marke.spaet { background: #F7DDD9; color: #8E2B1F; }

    .haken {
      width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
      border: 2px solid var(--linie); background: var(--flaeche);
      display: flex; align-items: center; justify-content: center;
      padding: 0; color: #fff; font-size: 15px;
    }
    .haken.an { background: var(--gruen); border-color: var(--gruen); }

    .weg {
      background: none; border: 0; color: var(--grau);
      font-size: 18px; padding: 0 4px; line-height: 1;
    }

    /* ---------- Neu-Knopf und Formular ---------- */
    .plus {
      position: fixed; right: 18px; bottom: 22px; z-index: 20;
      width: 58px; height: 58px; border-radius: 50%; border: 0;
      background: var(--akzent); color: #fff; font-size: 30px; line-height: 1;
      box-shadow: 0 6px 18px rgba(0,0,0,.2);
    }
    dialog {
      border: 0; border-radius: 20px 20px 0 0; padding: 22px 18px 26px;
      width: 100%; max-width: 480px; margin: auto auto 0;
      max-height: 92vh;
      background: var(--flaeche); color: var(--text);
    }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog h2 { margin: 0 0 16px; font-size: 19px; }
    label { display: block; font-size: 13px; color: var(--grau); margin: 12px 0 5px; }
    input, textarea {
      width: 100%; padding: 11px 12px; font: inherit;
      border: 1px solid var(--linie); border-radius: 11px;
      background: var(--grund); color: var(--text);
    }
    textarea { resize: vertical; min-height: 60px; }
    .reihe { display: flex; gap: 12px; }
    .reihe > div { flex: 1; }

    .wahl { display: flex; gap: 8px; }
    .wahl button {
      flex: 1; padding: 11px; border-radius: 11px;
      border: 1px solid var(--linie); background: var(--grund);
      color: var(--grau); font-weight: 600;
    }
    .wahl button.aktiv {
      background: var(--akzent); border-color: var(--akzent); color: #fff;
    }
    .wahl.klein { margin-top: 14px; }
    .wahl.klein button { font-size: 14px; padding: 9px; }

    /* Wochentage */
    .tageWahl { display: flex; gap: 6px; }
    .tagKnopf {
      flex: 1; padding: 10px 0; border-radius: 10px; font-size: 13px;
      border: 1px solid var(--linie); background: var(--grund);
      color: var(--grau); font-weight: 600;
    }
    .tagKnopf.aktiv {
      background: var(--gruen); border-color: var(--gruen); color: #fff;
    }

    .schalter {
      display: flex; align-items: center; gap: 10px;
      margin: 12px 0 0; font-size: 14px; color: var(--text);
      cursor: pointer;
    }
    .schalter input {
      width: 20px; height: 20px; flex-shrink: 0; margin: 0; padding: 0;
      accent-color: var(--gruen);
    }
    .hinweis { font-size: 12px; color: var(--grau); margin-top: 8px; line-height: 1.5; }

    .aktionen { display: flex; gap: 10px; margin-top: 22px; }
    .aktionen .knopf { flex: 1; }
    .fehler { color: var(--rot); font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- ============ Login ============ -->
  <div id="loginView" class="mitte">
    <div class="karte">
      <svg width="76" height="76" viewBox="0 0 120 120" aria-hidden="true">
        <rect width="120" height="120" rx="28" fill="#FFFCF7"/>
        <g fill="none" stroke-width="3.4">
          <circle cx="47" cy="45" r="27" stroke="#D4533B"/>
          <circle cx="76" cy="42" r="22" stroke="#DB8121"/>
          <circle cx="85" cy="70" r="30" stroke="#C9A227"/>
          <circle cx="58" cy="62" r="33" stroke="#3F9E5E"/>
          <circle cx="40" cy="78" r="24" stroke="#2E9E8F"/>
          <circle cx="68" cy="88" r="20" stroke="#3480B0"/>
          <circle cx="62" cy="55" r="17" stroke="#4C63C4"/>
        </g>
      </svg>
      <h1>Sawa</h1>
      <p>Termine und Aufgaben, die zusammenpassen.</p>
      <button class="knopf" id="loginBtn">Mit Google anmelden</button>
      <div id="loginFehler" class="fehler"></div>
    </div>
  </div>

  <!-- ============ App ============ -->
  <div id="appView" class="versteckt">

    <header>
      <svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true">
        <rect width="120" height="120" rx="28" fill="#FFFCF7"/>
        <g fill="none" stroke-width="5">
          <circle cx="50" cy="48" r="26" stroke="#D4533B"/>
          <circle cx="76" cy="60" r="30" stroke="#2E9E8F"/>
          <circle cx="48" cy="76" r="24" stroke="#4C63C4"/>
        </g>
      </svg>
      <span class="name">Sawa</span>
      <button class="rundknopf" id="sucheBtn" aria-label="Suchen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="#6B6259" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
      </button>
      <button class="textknopf" id="logoutBtn">Abmelden</button>
      <img id="photo" alt="">
    </header>

    <div class="suchleiste versteckt" id="suchleiste">
      <input id="sucheFeld" type="search" placeholder="Titel, Notiz oder Ort suchen"
             autocomplete="off">
      <button class="rundknopf" id="sucheZu" aria-label="Suche schliessen">&#10005;</button>
    </div>

    <div class="datumsleiste" id="datumsleiste">
      <button class="pfeil" id="zurueck" aria-label="Vorheriger Tag">&#8249;</button>
      <div class="tag">
        <b id="tagLang"></b>
        <span id="tagHinweis"></span>
      </div>
      <button class="pfeil" id="heuteBtn" aria-label="Heute">&#9679;</button>
      <button class="pfeil" id="vor" aria-label="Naechster Tag">&#8250;</button>
    </div>

    <main id="liste"></main>

    <button class="plus" id="neuBtn" aria-label="Neuer Eintrag">+</button>
  </div>

  <!-- ============ Formular ============ -->
  <dialog id="dlg">
    <form id="form">
      <h2 id="dlgTitel">Neuer Eintrag</h2>

      <div class="wahl">
        <button type="button" id="typTermin" class="aktiv">Termin</button>
        <button type="button" id="typTask">Aufgabe</button>
      </div>

      <div class="wahl klein">
        <button type="button" id="wdhEinmal" class="aktiv">Einmal</button>
        <button type="button" id="wdhSerie">Wiederholt sich</button>
      </div>

      <label for="fTitel">Titel</label>
      <input id="fTitel" required maxlength="120"
             placeholder="Zahnarzt, Einkaufen, Vorlesung">

      <label for="fDatum" id="lblDatum">Datum</label>
      <input id="fDatum" type="date" required>

      <div class="reihe">
        <div>
          <label for="fStart" id="lblStart">Von</label>
          <input id="fStart" type="time">
        </div>
        <div id="endeFeld">
          <label for="fEnde">Bis</label>
          <input id="fEnde" type="time">
        </div>
      </div>

      <!-- ---- Serie ---- -->
      <div id="serieFeld" class="versteckt">
        <label>An welchen Wochentagen</label>
        <div class="tageWahl" id="tageWahl"></div>

        <label for="fBis">Bis einschließlich</label>
        <input id="fBis" type="date">

        <label class="schalter" for="fFeiertage">
          <input type="checkbox" id="fFeiertage" checked>
          An Feiertagen aussetzen
        </label>

        <label class="schalter" for="fFerien">
          <input type="checkbox" id="fFerien">
          In den Schulferien aussetzen
        </label>

        <p class="hinweis">Feiertage und Ferien gelten für Nordrhein-Westfalen.</p>
      </div>

      <div id="fristFeld" class="versteckt">
        <label for="fFrist">Frist (optional)</label>
        <input id="fFrist" type="date">
      </div>

      <label for="fOrt">Ort (optional)</label>
      <input id="fOrt" maxlength="120" placeholder="MG, Düsseldorf, Online">

      <label for="fNotiz">Notiz</label>
      <textarea id="fNotiz" maxlength="500" placeholder="Optional"></textarea>

      <div id="formFehler" class="fehler"></div>

      <button type="button" class="knopf rand versteckt" id="absagenBtn"
              style="margin-top:18px">Diesen Tag absagen</button>

      <div class="aktionen">
        <button type="button" class="knopf hell" id="abbrechen">Abbrechen</button>
        <button type="submit" class="knopf">Speichern</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
